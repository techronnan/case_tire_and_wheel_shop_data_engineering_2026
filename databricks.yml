# Declarative Automation Bundle — cicd_pneus_store
# Documentação: https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: cicd_pneus_store

include:
  - resources/**/*.yml

variables:
  catalog:
    default: "pneus_store"
    description: "Catalog Unity Catalog alvo — schemas cantustore_bronze/silver/gold ficam dentro dele"
  notification_email:
    default: "ronnan_ok@hotmail.com"
    description: "E-mail para notificação de falha do Job"

targets:
  dev:
    default: true
    workspace:
      root_path: /Workspace/Shared/cicd_pneus_store_dev
    permissions:
      - level: CAN_MANAGE
        group_name: users
    variables:
      catalog: "pneus_store"

  prod:
    mode: production
    workspace:
      # Caminho fixo e compartilhado, não preso a pasta pessoal de usuário.
      # Numa empresa real, esse deploy roda via CI/CD autenticado como service
      # principal (run_as: service_principal_name: ...) — Free Edition não tem
      # console de admin pra criar um, então aqui ainda roda com conta pessoal.
      root_path: /Workspace/Shared/cicd_pneus_store
    # /Workspace/Shared dá acesso a todo mundo do workspace por padrão — declara
    # a permissão explicitamente em vez de deixar implícito.
    permissions:
      - level: CAN_MANAGE
        group_name: users
    variables:
      catalog: "pneus_store"
